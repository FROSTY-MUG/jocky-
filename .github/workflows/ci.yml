name: JOCKY CI Pipeline

# ==============================================================================
# JOCKY CI - multi-language build orchestration
# Purpose: Runs the justfile targets on each platform so every toolchain in
#          the repository (Rust, Go, Python, Bash, PowerShell, C++) is
#          exercised where it is native.
# Blueprint: Section 4 CI/CD Polymorphism & Attestation.
#
# Swift (macOS) and eBPF (Linux) jobs note their real environment
# requirements; see the corresponding agent READMEs.
# ==============================================================================

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  LLVM_SYS_170_PREFIX: /usr/lib/llvm-17

jobs:
  rust:
    name: Rust compiler + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM 17
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-17-dev clang-17
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test -p jockyc -- --nocapture

  go:
    name: Go tooling (ci/go + manager/go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build and vet ci/go
        working-directory: ci/go
        run: |
          go build ./...
          go vet ./...
      - name: Build and vet manager/go
        working-directory: manager/go
        run: |
          go build ./...
          go vet ./...

  python:
    name: Python CI tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r ci/py/requirements.txt
      - name: Byte-compile
        run: python -m py_compile ci/py/__init__.py ci/py/hash.py ci/py/sbom.py ci/py/registry.py
      - name: Import check
        run: python -c "from ci.py import hash, sbom, registry; print('ok')"
      - name: Hash smoke test
        run: python ci/py/hash.py README.md

  bash:
    name: Bash CI scripts (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax check
        run: |
          for f in ci/lib/common.sh ci/diversify.sh ci/sign.sh ci/verify.sh ci/sbom.sh; do
            bash -n "$f" || exit 1
          done
          echo "bash syntax OK"

  windows:
    name: PowerShell + C++ (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: PowerShell script smoke test
        shell: pwsh
        run: ./ci/ps/diversify.ps1 -Help
      - name: Batch wrapper
        run: cmd /c ci\diversify.bat --help
      - name: Build C++ agent
        run: |
          cmake -S agent/windows-cpp -B agent/windows-cpp/build
          cmake --build agent/windows-cpp/build --config Release
          .\agent\windows-cpp\build\Release\jocky-agent-win.exe --version

  ebpf:
    # Requires a Linux kernel with BTF and clang with the bpf target.
    name: eBPF programs (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install clang and libbpf
        run: sudo apt-get install -y clang libbpf-dev libelf-dev
      - name: Compile BPF object
        run: |
          clang -target bpf -D__TARGET_ARCH_x86 -O2 -g \
                -I/usr/include \
                -c agent/linux-ebpf/src/syscall_trace.bpf.c \
                -o agent/linux-ebpf/src/syscall_trace.bpf.o

  macos:
    # Swift requires macOS 13+ with Xcode 15+.
    name: Swift agent (macOS)
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Build Swift package
        working-directory: agent/macos-swift
        run: swift build
