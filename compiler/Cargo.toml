[package]
name = "jockyc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "JOCKY DFIR-domain compiler: lexer, parser, HIR, MIR, passes, and LLVM codegen"
readme = "README.md"

[dependencies]
logos = "0.14"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2.1", features = ["pem"] }
rand = "0.8"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
jocky-common = { path = "../agent/common" }
inkwell = { version = "0.4", features = ["llvm17-0"] }
llvm-sys = "170"

[features]
default = []